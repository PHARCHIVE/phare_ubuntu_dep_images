name: CMake Ubuntu

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        images: ['ubuntu:26.04', 'ghcr.io/0xz/hpc-containers:cuda', 'ghcr.io/0xz/hpc-containers:rocm']

    steps:
    - uses: actions/checkout@v6

    # the GPU toolkit bases are several GB each (hpc-containers:rocm ~8GB), more than a runner
    #  has free by default
    - name: Free disk space
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        docker image prune -af
        df -h /

    - name: Build
      run: chmod +x build.sh && ./build.sh ${{ matrix.images }}

    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ secrets.GCHR_USERNAME }}
        password: ${{ secrets.GCHR_TOKEN }}

    - name: docker push
      run: docker push ${IMAGE}
